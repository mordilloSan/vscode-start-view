name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    name: Package extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check syntax
        run: node --check extension.js
      - name: Check version matches release branch
        if: startsWith(github.head_ref, 'dev/v')
        run: |
          expected=${GITHUB_HEAD_REF#dev/v}
          actual=$(jq -r .version package.json)
          if [[ ! $expected =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The Marketplace only accepts MAJOR.MINOR.PATCH versions (got '$expected')."
            exit 1
          fi
          if [[ $actual != "$expected" ]]; then
            echo "::error file=package.json::Bump \"version\": package.json has '$actual', expected '$expected'."
            exit 1
          fi
      - name: Package
        run: npm run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: "*.vsix"
          if-no-files-found: error
